<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memobuch</title>
  
  <link rel="stylesheet" href="/memo/static/css/styles.css">
  
</head>
<body>

  
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <!-- Custom CSS for the map -->
    <link rel="stylesheet" href="/memo/static/apps/map/map.css">

    

    <section>

         <!-- Filter Controls -->
        <div class="controls-panel">
            <div class="controls-content">
                <div class="filter-section">
                    <h3 class="filter-title">Ereignistypen filtern</h3>
                    <div class="filter-grid">
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filter-voluntary" checked data-event-type="voluntary_residence">
                            <span class="filter-label">
                                <span class="color-indicator" style="background-color: #2196F3;"></span>
                                Freiwillige Wohnadresse
                            </span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filter-forced" checked data-event-type="forced_residence">
                            <span class="filter-label">
                                <span class="color-indicator" style="background-color: #FF9800;"></span>
                                Erzwungene Wohnadresse
                            </span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filter-imprisonment" checked data-event-type="imprisonment">
                            <span class="filter-label">
                                <span class="color-indicator" style="background-color: #F44336;"></span>
                                Haft
                            </span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filter-flight" checked data-event-type="flight">
                            <span class="filter-label">
                                <span class="color-indicator" style="background-color: #9C27B0;"></span>
                                Flucht
                            </span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filter-death" checked data-event-type="death">
                            <span class="filter-label">
                                <span class="color-indicator" style="background-color: #000000;"></span>
                                Tod
                            </span>
                        </label>
                    </div>
                </div>
                
                <div class="stats-section">
                    <div class="stat-item">
                        <span class="stat-label">Personen:</span>
                        <span class="stat-value" id="total-persons">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Ereignisse:</span>
                        <span class="stat-value" id="total-events">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Sichtbar:</span>
                        <span class="stat-value" id="visible-events">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Map Container -->
        <div id="map" class="map-container"></div>
    </section>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    
    <!-- Custom JS -->
    <script src="/memo/static/apps/map/map.js"></script>

</body>
</html>
